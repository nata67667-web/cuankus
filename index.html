<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Rating Teknikal Saham</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background: #1a1a2e;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    text-align: center;
    color: #4ade80;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }
  .upload-area {
    border: 2px dashed #4ade80;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .upload-area:hover { background: #1f2f3f; }
  .upload-area input { display: none; }
  .upload-area label {
    cursor: pointer;
    color: #4ade80;
    font-size: 14px;
  }
  #preview {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    margin-top: 10px;
    display: none;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    background: #0f0f1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .form-group input:focus { border-color: #4ade80; }
  .row { display: flex; gap: 8px; }
  .row .form-group { flex: 1; }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #0f0f1a;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  #hasil {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    display: none;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #hasil .rating {
    font-size: 48px;
    font-weight: bold;
    line-height: 1;
  }
  #hasil .status {
    font-size: 20px;
    font-weight: bold;
    margin-top: 8px;
  }
  #hasil .detail {
    font-size: 12px;
    margin-top: 12px;
    opacity: 0.8;
    text-align: left;
    line-height: 1.6;
  }
  .strong-sell { background: #7f1d1d; color: #fecaca; }
  .sell { background: #9a3412; color: #fed7aa; }
  .hold { background: #854d0e; color: #fef08a; }
  .buy { background: #166534; color: #bbf7d0; }
  .strong-buy { background: #14532d; color: #86efac; }
  .footer {
    text-align: center;
    font-size: 10px;
    color: #555;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Cek Rating Teknikal</h1>
  <p class="subtitle">Upload screenshot, isi angka, dapatkan rating 1-100</p>

  <div class="upload-area">
    <input type="file" id="gambar" accept="image/*" onchange="previewGambar(event)">
    <label for="gambar">📸 Tap untuk upload screenshot saham</label>
    <img id="preview" alt="Preview">
  </div>

  <div class="row">
    <div class="form-group">
      <label>Harga</label>
      <input type="number" id="harga" placeholder="176">
    </div>
    <div class="form-group">
      <label>MA 9</label>
      <input type="number" id="ma9" placeholder="179">
    </div>
    <div class="form-group">
      <label>MA 26</label>
      <input type="number" id="ma26" placeholder="184">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Volume (K)</label>
      <input type="number" id="volume" placeholder="98">
    </div>
    <div class="form-group">
      <label>Avg Volume (K)</label>
      <input type="number" id="avgVol" placeholder="123">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>RSI 14</label>
      <input type="number" id="rsi" placeholder="34">
    </div>
    <div class="form-group">
      <label>Coppock</label>
      <input type="number" id="coppock" placeholder="-8.62">
    </div>
    <div class="form-group">
      <label>Accum/Dist (Juta)</label>
      <input type="number" id="accum" placeholder="-2.26">
    </div>
  </div>

  <button onclick="hitungRating()">Hitung Rating</button>

  <div id="hasil"></div>

  <p class="footer">⚠️ Bukan saran investasi. Risiko ditanggung sendiri.</p>
</div>

<script>
function previewGambar(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById('preview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

function hitungRating() {
  const harga = parseFloat(document.getElementById('harga').value) || 0;
  const ma9 = parseFloat(document.getElementById('ma9').value) || 0;
  const ma26 = parseFloat(document.getElementById('ma26').value) || 0;
  const volume = parseFloat(document.getElementById('volume').value) || 0;
  const avgVol = parseFloat(document.getElementById('avgVol').value) || 1;
  const rsi = parseFloat(document.getElementById('rsi').value) || 50;
  const coppock = parseFloat(document.getElementById('coppock').value) || 0;
  const accum = parseFloat(document.getElementById('accum').value) || 0;

  // --- Hitung skor per indikator (0-100) ---
  
  // 1. MA Cross (bobot 30%)
  let skorMA = 50;
  if (harga > ma9 && harga > ma26) skorMA = 90;
  else if (harga < ma9 && harga < ma26) skorMA = 10;
  if (ma9 > ma26) skorMA += 10;
  else skorMA -= 10;
  skorMA = Math.max(0, Math.min(100, skorMA));

  // 2. Volume (bobot 20%)
  let skorVol = 50;
  const volRatio = volume / avgVol;
  if (volRatio > 1.5 && harga > ma9) skorVol = 90;      // Volume besar + harga naik
  else if (volRatio > 1.5 && harga < ma9) skorVol = 10; // Volume besar + harga turun (panic sell)
  else if (volRatio < 0.5) skorVol = 30;                 // Volume sepi
  else if (volRatio > 1.0) skorVol = 60;
  else skorVol = 40;

  // 3. RSI (bobot 15%)
  let skorRSI = 50;
  if (rsi < 30) skorRSI = 85;       // Oversold = potensi rebound
  else if (rsi < 40) skorRSI = 60;  // Mendekati oversold
  else if (rsi > 70) skorRSI = 15;  // Overbought = bahaya
  else if (rsi > 60) skorRSI = 40;
  else skorRSI = 50;

  // 4. Coppock (bobot 20%)
  let skorCoppock = 50;
  if (coppock > 5) skorCoppock = 90;
  else if (coppock > 0) skorCoppock = 75;
  else if (coppock > -2) skorCoppock = 40;
  else if (coppock > -5) skorCoppock = 25;
  else skorCoppock = 10;  // Sangat negatif

  // 5. Accum/Dist (bobot 15%)
  let skorAccum = 50;
  if (accum > 1) skorAccum = 85;
  else if (accum > 0) skorAccum = 65;
  else if (accum > -1) skorAccum = 35;
  else skorAccum = 15;

  // --- Total skor tertimbang ---
  const total = Math.round(
    skorMA * 0.30 +
    skorVol * 0.20 +
    skorRSI * 0.15 +
    skorCoppock * 0.20 +
    skorAccum * 0.15
  );

  // --- Tentukan status ---
  let status, kelas;
  if (total >= 80) { status = 'STRONG BUY'; kelas = 'strong-buy'; }
  else if (total >= 60) { status = 'BUY'; kelas = 'buy'; }
  else if (total >= 40) { status = 'HOLD / WAIT'; kelas = 'hold'; }
  else if (total >= 20) { status = 'SELL / AVOID'; kelas = 'sell'; }
  else { status = 'STRONG SELL'; kelas = 'strong-sell'; }

  // --- Tampilkan ---
  const hasil = document.getElementById('hasil');
  hasil.className = kelas;
  hasil.style.display = 'block';
  hasil.innerHTML = `
    <div class="rating">${total}<span style="font-size:20px">/100</span></div>
    <div class="status">${status}</div>
    <div class="detail">
      MA Cross: ${skorMA}/100<br>
      Volume: ${skorVol}/100<br>
      RSI: ${skorRSI}/100<br>
      Coppock: ${skorCoppock}/100<br>
      Accum/Dist: ${skorAccum}/100
    </div>
  `;

  // Scroll ke hasil
  hasil.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
