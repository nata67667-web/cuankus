<script>
  // daftar id input yang dipakai
  const inputs = ['per','pbv','npm','bidVol','offerVol','buy','sell'];

  // load saved values
  function loadSaved() {
    inputs.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const saved = localStorage.getItem('as_' + id);
      if (saved !== null) el.value = saved;
    });
  }

  // simpan value ke localStorage
  function saveValue(id, value) {
    localStorage.setItem('as_' + id, value);
  }

  // fungsi hitung sederhana sesuai aturan tanpa rencana trading
  function calculateAll() {
    // Fundamental
    const per = parseFloat(document.getElementById('per')?.value) || 0;
    const pbv = parseFloat(document.getElementById('pbv')?.value) || 0;
    const npm = parseFloat(document.getElementById('npm')?.value) || 0;
    let fundamentalScore = 0;
    if (per > 0 && per < 15) fundamentalScore += 10;
    else if (per >= 15 && per <= 30) fundamentalScore += 7;
    else if (per > 30) fundamentalScore += 5;
    if (pbv > 0 && pbv < 1) fundamentalScore += 8;
    else if (pbv >=1 && pbv <=2) fundamentalScore += 5;
    else if (pbv > 2) fundamentalScore += 3;
    if (npm > 10) fundamentalScore += 7;
    else if (npm >=5 && npm <=10) fundamentalScore += 5;
    else fundamentalScore += 0;
    document.getElementById('fundamentalResult').innerText = `Skor Fundamental: ${fundamentalScore}/25`;

    // Bid & Offer
    const bidVol = parseFloat(document.getElementById('bidVol')?.value) || 0;
    const offerVol = parseFloat(document.getElementById('offerVol')?.value) || 1;
    const ratio = offerVol > 0 ? bidVol / offerVol : 0;
    let bidScore = 0;
    if (ratio > 1.5) bidScore = 10;
    else if (ratio >= 1.0) bidScore = 7;
    else if (ratio >= 0.8) bidScore = 5;
    else bidScore = 2;
    document.getElementById('bidOfferResult').innerText = `Rasio Bid/Offer: ${ratio.toFixed(2)} → Skor ${bidScore}/10`;

    // Broker
    const buy = parseFloat(document.getElementById('buy')?.value) || 0;
    const sell = parseFloat(document.getElementById('sell')?.value) || 0;
    const netBuy = buy - sell;
    const brokerScore = netBuy > 0 ? 15 : 5;
    document.getElementById('brokerResult').innerText = `Net Buy: ${netBuy} → Skor ${brokerScore}/15`;

    // Total dan kesimpulan
    const totalScore = fundamentalScore + bidScore + brokerScore;
    const maxScore = 25 + 10 + 15; // 50
    const percent = Math.round((totalScore / maxScore) * 100);
    document.getElementById('totalScore').innerText = `TOTAL: ${totalScore}/${maxScore} (${percent}%)`;
    document.getElementById('scoreFill').style.width = percent + '%';

    let result = 'DATA TIDAK CUKUP';
    if (totalScore >= 40) result = '🟢 LAYAK';
    else if (totalScore >= 25) result = '🟡 TUNGGU';
    else result = '🔴 HINDARI';
    document.getElementById('finalResult').innerText = result;
  }

  // attach listeners
  function attachListeners() {
    inputs.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', (e) => {
        saveValue(id, e.target.value);
        calculateAll();
      });
    });
  }

  // init
  window.addEventListener('DOMContentLoaded', () => {
    loadSaved();
    attachListeners();
    calculateAll(); // hitung sekali saat load
  });
</script>
