<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Online - Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Lora:wght@400;600&family=Montserrat:wght@300;400;600&family=Raleway:wght@300;400;600&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #7d5a50;
    --primary-dark: #5c4033;
    --accent: #b08968;
    --bg: #ffffff;
    --bg-soft: #fffdfb;
    --text: #3a2e2a;
    --font-title: 'Great Vibes', cursive;
    --font-body: 'Poppins', sans-serif;
    --font-serif: 'Playfair Display', serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: all 0.4s ease;
  }

  /* ===== EDITOR PANEL ===== */
  .editor-toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10000;
    background: var(--primary);
    color: #fff;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    transition: transform 0.3s;
  }
  .editor-toggle:hover { transform: rotate(90deg); }

  .editor {
    position: fixed;
    top: 0;
    left: 0;
    width: 340px;
    height: 100vh;
    background: #fff;
    box-shadow: 5px 0 30px rgba(0,0,0,0.15);
    z-index: 9999;
    transform: translateX(-100%);
    transition: transform 0.4s ease;
    overflow-y: auto;
    padding: 70px 20px 30px;
  }
  .editor.open { transform: translateX(0); }

  .editor h3 {
    font-size: 1rem;
    color: var(--primary);
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0e3d6;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .editor-group {
    margin-bottom: 25px;
  }

  .editor label {
    display: block;
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 5px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .editor input[type="text"],
  .editor input[type="date"],
  .editor input[type="number"],
  .editor textarea,
  .editor select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #e8d5c4;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 0.85rem;
    margin-bottom: 10px;
    background: #fdfaf7;
    color: var(--text);
  }
  .editor input:focus, .editor select:focus, .editor textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  .editor input[type="color"] {
    width: 100%;
    height: 40px;
    border: 1px solid #e8d5c4;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 10px;
    background: #fff;
  }

  .editor input[type="file"] {
    width: 100%;
    font-size: 0.75rem;
    margin-bottom: 10px;
  }

  .editor .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-editor {
    width: 100%;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.3s;
    letter-spacing: 0.5px;
  }
  .btn-editor:hover { background: var(--primary-dark); }
  .btn-editor.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .btn-editor.secondary:hover { background: #fdfaf7; }

  /* ===== THEME PRESETS ===== */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }

  .theme-swatch {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s;
    position: relative;
  }
  .theme-swatch:hover { transform: scale(1.05); }
  .theme-swatch.active { border-color: var(--primary); }

  /* ===== PREVIEW UNDANGAN ===== */
  .invitation {
    transition: padding-left 0.4s;
  }
  .invitation.shifted {
    padding-left: 340px;
  }

  /* ===== FLORAL DECOR ===== */
  .floral-top, .floral-bottom {
    position: absolute;
    width: 220px;
    height: 220px;
    pointer-events: none;
    opacity: 0.9;
    z-index: 1;
  }
  .floral-top { top: -20px; left: -30px; }
  .floral-bottom { bottom: -20px; right: -30px; transform: rotate(180deg); }
  .floral-svg { width: 100%; height: 100%; }

  /* ===== COVER ===== */
  .cover {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 999;
    transition: transform 1s ease, opacity 1s ease;
    padding: 20px;
    overflow: hidden;
  }
  .cover.hide {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }
  .cover-inner {
    position: relative;
    z-index: 2;
    padding: 40px;
    border: 1px solid #e8d5c4;
    border-radius: 20px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    max-width: 420px;
    width: 100%;
  }
  .cover .label {
    letter-spacing: 5px;
    font-size: 0.75rem;
    margin-bottom: 25px;
    color: var(--accent);
  }
  .cover h1 {
    font-family: var(--font-title);
    font-size: clamp(2.8rem, 11vw, 4rem);
    color: var(--primary-dark);
    margin-bottom: 5px;
    line-height: 1;
  }
  .cover .amp {
    font-family: var(--font-title);
    font-size: 2rem;
    color: var(--accent);
    margin: 8px 0;
  }
  .cover .date {
    font-size: 0.9rem;
    letter-spacing: 4px;
    margin: 25px 0 35px;
    color: var(--primary);
  }
  .btn-open {
    background: var(--primary);
    border: none;
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  .btn-open:hover { background: var(--primary-dark); transform: scale(1.05); }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 20px 60px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .hero-photo {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid #fff;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    margin-bottom: 30px;
    position: relative;
    z-index: 2;
  }
  .hero-photo-wrap {
    position: relative;
    display: inline-block;
  }
  .hero-photo-wrap::before {
    content: '';
    position: absolute;
    inset: -15px;
    border-radius: 50%;
    border: 1px dashed var(--accent);
    animation: rotate 30s linear infinite;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .hero .subtitle {
    letter-spacing: 5px;
    font-size: 0.8rem;
    color: var(--accent);
    margin-bottom: 15px;
    position: relative;
    z-index: 2;
  }
  .hero h2 {
    font-family: var(--font-title);
    font-size: clamp(3rem, 10vw, 4.5rem);
    color: var(--primary-dark);
    line-height: 1.1;
    position: relative;
    z-index: 2;
  }
  .hero .tgl {
    margin-top: 25px;
    padding: 12px 30px;
    border-top: 1px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    font-size: 0.95rem;
    letter-spacing: 3px;
    color: var(--primary);
    position: relative;
    z-index: 2;
  }

  /* ===== COUNTDOWN ===== */
  .countdown {
    display: flex;
    gap: 15px;
    margin-top: 40px;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .cd-box {
    background: #fff;
    border-radius: 12px;
    padding: 15px 20px;
    min-width: 75px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border: 1px solid #f0e3d6;
  }
  .cd-box .num {
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--primary);
    font-family: var(--font-serif);
  }
  .cd-box .lbl {
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
  }

  /* ===== SECTION ===== */
  section {
    padding: 80px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .section-title {
    font-family: var(--font-title);
    font-size: clamp(2.2rem, 7vw, 3rem);
    color: var(--primary);
    margin-bottom: 10px;
  }
  .section-sub {
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 45px;
    text-transform: uppercase;
  }

  /* ===== COUPLE ===== */
  .couple { background: var(--bg-soft); }
  .couple-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  .person { flex: 1; min-width: 220px; max-width: 320px; }
  .person .avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px;
    overflow: hidden;
    border: 5px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .person .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .person h3 {
    font-family: var(--font-serif);
    font-size: 1.6rem;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .person p { font-size: 0.85rem; color: var(--accent); line-height: 1.7; }
  .amp-circle { font-family: var(--font-title); font-size: 3rem; color: var(--accent); }

  /* ===== ACARA ===== */
  .acara { background: var(--bg); }
  .acara-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    max-width: 800px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 35px 25px;
    flex: 1;
    min-width: 260px;
    max-width: 340px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    border: 1px solid #f0e3d6;
    position: relative;
  }
  .card::before {
    content: '❀';
    position: absolute;
    top: 10px;
    right: 15px;
    color: var(--accent);
    font-size: 1.5rem;
    opacity: 0.4;
  }
  .card .icon { font-size: 2.5rem; margin-bottom: 15px; }
  .card h4 {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    color: var(--primary-dark);
    margin-bottom: 15px;
  }
  .card .detail { font-size: 0.9rem; color: var(--primary); line-height: 1.8; }
  .card .detail strong { color: var(--primary-dark); }

  /* ===== GALERI ===== */
  .galeri { background: var(--bg-soft); }
  .galeri-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .galeri-item {
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 3/4;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: transform 0.4s;
  }
  .galeri-item:hover { transform: scale(1.03); }
  .galeri-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ===== RSVP ===== */
  .rsvp { background: var(--bg); }
  .form-box {
    background: #fff;
    border-radius: 16px;
    padding: 35px 25px;
    max-width: 500px;
    margin: 0 auto 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    border: 1px solid #f0e3d6;
  }
  .form-box input, .form-box textarea, .form-box select {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 1px solid #e8d5c4;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: var(--bg-soft);
    color: var(--text);
  }
  .form-box input:focus, .form-box textarea:focus, .form-box select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-box textarea { resize: vertical; min-height: 90px; }
  .form-box button {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .form-box button:hover { background: var(--primary-dark); }
  .ucapan-list { max-width: 600px; margin: 0 auto; text-align: left; }
  .ucapan-item {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    border-left: 4px solid var(--accent);
  }
  .ucapan-item .nama { font-weight: 600; color: var(--primary-dark); font-size: 0.95rem; margin-bottom: 3px; }
  .ucapan-item .status { font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; letter-spacing: 1px; }
  .ucapan-item .pesan { font-size: 0.88rem; color: var(--primary); line-height: 1.6; }

  /* ===== GIFT ===== */
  .gift { background: var(--bg-soft); }
  .rekening {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  .rek-card {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    border-radius: 16px;
    padding: 30px 25px;
    flex: 1;
    min-width: 260px;
    max-width: 320px;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .rek-card .bank { font-size: 0.85rem; letter-spacing: 2px; opacity: 0.9; margin-bottom: 10px; }
  .rek-card .norek {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }
  .rek-card .an { font-size: 0.85rem; opacity: 0.9; }
  .rek-card .copy-btn {
    margin-top: 15px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: var(--font-body);
    transition: background 0.3s;
  }
  .rek-card .copy-btn:hover { background: rgba(255,255,255,0.3); }

  /* ===== FOOTER ===== */
  footer {
    background: var(--primary-dark);
    color: #f5ebe0;
    text-align: center;
    padding: 60px 20px 30px;
    position: relative;
    overflow: hidden;
  }
  footer .thanks {
    font-family: var(--font-title);
    font-size: 2.5rem;
    margin-bottom: 15px;
    color: var(--accent);
  }
  footer p { font-size: 0.85rem; opacity: 0.85; line-height: 1.8; }

  /* ===== MUSIC BTN ===== */
  .music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .music-btn.show { display: flex; }
  .music-btn.playing { animation: spin 3s linear infinite; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== FADE IN ===== */
  .fade-in {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .couple-grid { gap: 20px; }
    .amp-circle { font-size: 2rem; }
    section { padding: 60px 15px; }
    .hero-photo { width: 200px; height: 200px; }
    .floral-top, .floral-bottom { width: 140px; height: 140px; }
    .editor { width: 90%; max-width: 340px; }
    .invitation.shifted { padding-left: 0; }
  }
</style>
</head>
<body>

<!-- ===== EDITOR TOGGLE ===== -->
<button class="editor-toggle" onclick="toggleEditor()">⚙️</button>

<!-- ===== EDITOR PANEL ===== -->
<aside class="editor" id="editor">
  <h3>🎨 Tema Warna</h3>
  <div class="editor-group">
    <div class="theme-grid" id="themeGrid">
      <div class="theme-swatch" data-primary="#7d5a50" data-accent="#b08968" data-dark="#5c4033" data-bg="#ffffff" data-soft="#fffdfb" style="background: linear-gradient(135deg,#7d5a50,#b08968);"></div>
      <div class="theme-swatch" data-primary="#8b6f9c" data-accent="#c4a8d4" data-dark="#5a4570" data-bg="#ffffff" data-soft="#faf7fc" style="background: linear-gradient(135deg,#8b6f9c,#c4a8d4);"></div>
      <div class="theme-swatch" data-primary="#5c8a8a" data-accent="#a4c4c4" data-dark="#3d6b6b" data-bg="#ffffff" data-soft="#f7fafa" style="background: linear-gradient(135deg,#5c8a8a,#a4c4c4);"></div>
      <div class="theme-swatch" data-primary="#a8654f" data-accent="#d4a08a" data-dark="#7a4433" data-bg="#ffffff" data-soft="#fdf8f5" style="background: linear-gradient(135deg,#a8654f,#d4a08a);"></div>
      <div class="theme-swatch" data-primary="#4a5568" data-accent="#a0aec0" data-dark="#2d3748" data-bg="#ffffff" data-soft="#f7fafc" style="background: linear-gradient(135deg,#4a5568,#a0aec0);"></div>
      <div class="theme-swatch" data-primary="#b8945c" data-accent="#e0c896" data-dark="#8a6d3d" data-bg="#ffffff" data-soft="#fdfaf3" style="background: linear-gradient(135deg,#b8945c,#e0c896);"></div>
      <div class="theme-swatch" data-primary="#7a9b76" data-accent="#b8d4b2" data-dark="#557052" data-bg="#ffffff" data-soft="#f7faf6" style="background: linear-gradient(135deg,#7a9b76,#b8d4b2);"></div>
      <div class="theme-swatch" data-primary="#c25a7c" data-accent="#e8a0b8" data-dark="#96385a" data-bg="#ffffff" data-soft="#fdf7fa" style="background: linear-gradient(135deg,#c25a7c,#e8a0b8);"></div>
      <div class="theme-swatch" data-primary="#3a2e2a" data-accent="#8a7a72" data-dark="#1a1210" data-bg="#f5f5f5" data-soft="#ebebeb" style="background: linear-gradient(135deg,#3a2e2a,#8a7a72);"></div>
    </div>
    <label>Warna Utama</label>
    <input type="color" id="colorPrimary" value="#7d5a50">
    <label>Warna Aksen</label>
    <input type="color" id="colorAccent" value="#b08968">
    <label>Warna Latar</label>
    <input type="color" id="colorBg" value="#ffffff">
  </div>

  <h3>✍️ Jenis Huruf</h3>
  <div class="editor-group">
    <label>Font Judul</label>
    <select id="fontTitle">
      <option value="'Great Vibes', cursive">Great Vibes (Script)</option>
      <option value="'Dancing Script', cursive">Dancing Script</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
      <option value="'Lora', serif">Lora</option>
      <option value="'Poppins', sans-serif">Poppins</option>
    </select>
    <label>Font Isi</label>
    <select id="fontBody">
      <option value="'Poppins', sans-serif">Poppins</option>
      <option value="'Montserrat', sans-serif">Montserrat</option>
      <option value="'Raleway', sans-serif">Raleway</option>
      <option value="'Quicksand', sans-serif">Quicksand</option>
      <option value="'Lora', serif">Lora</option>
    </select>
  </div>

  <h3>📝 Tulisan</h3>
  <div class="editor-group">
    <label>Nama Mempelai 1</label>
    <input type="text" id="inNama1" value="Andi">
    <label>Nama Mempelai 2</label>
    <input type="text" id="inNama2" value="Sinta">
    <label>Tanggal Acara</label>
    <input type="text" id="inTanggal" value="12 . 12 . 2025">
    <label>Subtitle Hero</label>
    <input type="text" id="inSubtitle" value="WE ARE GETTING MARRIED">
  </div>

  <h3>📅 Detail Acara</h3>
